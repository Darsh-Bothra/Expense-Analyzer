[project]
name = "expense-analyzer"
version = "0.1.0"
description = "UPI expense analyzer: CSV/XLSX analytics plus grounded LLM JSON insights"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0.1",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-groq>=0.2.0",
  "langchain-openai>=0.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
